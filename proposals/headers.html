<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; padding: 24px; background: #e9eaee; font-family: Roboto, "Segoe UI", Arial, sans-serif; color: #1f2937; }
h1 { font-size: 20px; margin: 0 0 6px; } h2 { font-size: 15px; margin: 22px 0 8px; } p.note { margin: 0 0 6px; font-size: 13px; color: #555; }
.row { display: flex; gap: 18px; }
.card { width: 500px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.card.dark { background: #1c1c1e; color: #e5e7eb; }
.banner { position: relative; height: 90px; overflow: hidden; }
.banner svg.scene { position: absolute; right: 0; bottom: 10px; height: 80px; width: 300px; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; }
.head { position: absolute; left: 16px; top: 16px; display: flex; gap: 12px; align-items: flex-start; }
.ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
.t { font-weight: 600; font-size: 16px; line-height: 20px; } .s { font-size: 13px; opacity: .75; }
.pill { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; vertical-align: 1px; }
.body { height: 34px; padding: 10px 16px; font-size: 12px; opacity: .55; }
.lab { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
</style></head><body>
<h1>Header scene proposals</h1>
<p class="note">Each card gets a scene across the right of its 90 px header (like the flight, cover or alarm cards), the 10 px ground bar, day and night versions. Only the header changes; the warning state is shown on the right of each pair.</p>
<div id="out"></div>
<script>
const M = {
  sky: ["linear-gradient(#ccfbf1,#f0fdfa)", "linear-gradient(#0c2626,#153838)"], ground: ["#5eead4", "#2c6b66"],
  ico: ["#ccfbf1", "#1f4040"], icoC: "#0d9488", title: "Maintenance", sub: ["11 tracked · next in 3 d", "11 tracked · 2 overdue"],
};
const N = {
  sky: ["linear-gradient(#dbeafe,#f0f6ff)", "linear-gradient(#0f1b33,#1c2a48)"], ground: ["#93c5fd", "#36507e"],
  ico: ["#dbeafe", "#22345a"], icoC: "#2563eb", title: "Notify Hub", sub: ["Next digest at 19:00", "1 alert to acknowledge"],
};
// palette helpers per theme (0 day, 1 night)
const P = (d, n, i) => (i ? n : d);

// ───────── Maintenance ─────────
const maintA = (i, bad) => `
  <!-- A · Workshop: workbench, pegboard of tools, a filter cartridge and a wall calendar (red day when overdue) -->
  <rect x="96" y="6" width="150" height="50" rx="4" fill="${P("#fdf6e3","#2b3a3a",i)}" stroke="${P("#e7d8b1","#3f5656",i)}" stroke-width="2"/>
  ${[0,1,2,3,4,5,6].map(x=>[0,1].map(y=>`<circle cx="${108+x*21}" cy="${16+y*18}" r="1.5" fill="${P("#d6c49a","#4f6a6a",i)}"/>`).join("")).join("")}
  <g class="spin" style="transform-origin:124px 31px"><path d="M122 18h4l1 4 3 1.5 3-2.5 3 3-2.5 3 1.5 3 4 1v4l-4 1-1.5 3 2.5 3-3 3-3-2.5-3 1.5-1 4h-4l-1-4-3-1.5-3 2.5-3-3 2.5-3-1.5-3-4-1v-4l4-1 1.5-3-2.5-3 3-3 3 2.5 3-1.5z" fill="${P("#5eead4","#2dd4bf",i)}"/><circle cx="124" cy="31" r="4" fill="${P("#fdf6e3","#2b3a3a",i)}"/></g>
  <g class="${bad?"turn":""}" style="transform-origin:170px 14px"><path d="M170 12a7 7 0 0 0-6 9l-11 20a3 3 0 0 0 5 3l11-20a7 7 0 0 0 9-8l-4 2-4-2v-4z" fill="${bad?"#ef4444":P("#94a3b8","#cbd5e1",i)}"/></g>
  <rect x="188" y="14" width="16" height="34" rx="3" fill="#fff" stroke="${bad?"#f59e0b":P("#5eead4","#2dd4bf",i)}" stroke-width="2"/>
  <path d="M191 21h10M191 27h10M191 33h10M191 39h10" stroke="${bad?"#fcd34d":P("#99f6e4","#5eead4",i)}" stroke-width="2"/>
  <!-- calendar -->
  <rect x="216" y="12" width="24" height="26" rx="3" fill="#fff" stroke="${P("#cbd5e1","#64748b",i)}" stroke-width="1.5"/>
  <rect x="216" y="12" width="24" height="7" rx="3" fill="${bad?"#ef4444":P("#0d9488","#14b8a6",i)}"/>
  <text x="228" y="33" font-size="11" font-weight="700" text-anchor="middle" fill="${bad?"#ef4444":"#334155"}">${bad?"!":"3"}</text>
  <!-- bench -->
  <rect x="84" y="58" width="190" height="7" rx="2" fill="${P("#c08a52","#7a5534",i)}"/>
  <rect x="94" y="65" width="6" height="15" fill="${P("#a8743f","#5e4128",i)}"/><rect x="258" y="65" width="6" height="15" fill="${P("#a8743f","#5e4128",i)}"/>
  <!-- toolbox on the bench -->
  <rect x="120" y="46" width="34" height="12" rx="2" fill="${P("#f97316","#c2410c",i)}"/><path d="M130 46v-4h14v4" fill="none" stroke="${P("#9a3412","#7c2d12",i)}" stroke-width="2"/>
  <!-- spray bottle -->
  <rect x="226" y="44" width="10" height="14" rx="2" fill="${P("#60a5fa","#3b82f6",i)}"/><path d="M228 44v-4h8l3 2" fill="none" stroke="${P("#334155","#94a3b8",i)}" stroke-width="2"/>`;

const maintB = (i, bad) => `
  <!-- B · Utility room: water heater with its gauge, washing machine, a ladder; the gauge needle leans red when overdue -->
  <rect x="30" y="0" width="300" height="80" fill="${P("#e6fffa","#173434",i)}" opacity=".0"/>
  <!-- water heater -->
  <rect x="104" y="6" width="40" height="70" rx="18" fill="${P("#f8fafc","#d7dee6",i)}" stroke="${P("#cbd5e1","#7b8794",i)}" stroke-width="2"/>
  <circle cx="124" cy="30" r="10" fill="#fff" stroke="${P("#94a3b8","#64748b",i)}" stroke-width="2"/>
  <path d="M124 30 L${bad?"131 25":"119 24"}" stroke="${bad?"#ef4444":"#0d9488"}" stroke-width="2.5" stroke-linecap="round" class="${bad?"wob":""}" style="transform-origin:124px 30px"/>
  <path d="M116 76v4M132 76v4" stroke="${P("#94a3b8","#64748b",i)}" stroke-width="3"/>
  <path d="M112 6v-6M136 6v-6" stroke="${P("#b45309","#d97706",i)}" stroke-width="3"/>
  <!-- washing machine -->
  <rect x="160" y="30" width="46" height="50" rx="5" fill="${P("#f8fafc","#d7dee6",i)}" stroke="${P("#cbd5e1","#7b8794",i)}" stroke-width="2"/>
  <rect x="160" y="30" width="46" height="9" rx="4" fill="${P("#e2e8f0","#aab4c0",i)}"/>
  <circle cx="183" cy="60" r="13" fill="${P("#bae6fd","#5b8bb3",i)}" stroke="${P("#94a3b8","#64748b",i)}" stroke-width="3"/>
  <path class="spin" style="transform-origin:183px 60px" d="M176 62q7 -6 14 0" stroke="#fff" stroke-width="2" fill="none"/>
  <circle cx="198" cy="34.5" r="2" fill="${bad?"#f59e0b":"#22c55e"}"/>
  <!-- ladder -->
  <path d="M228 80l14-74M252 80l-4-74" stroke="${P("#a8743f","#7a5534",i)}" stroke-width="3"/>
  ${[0,1,2,3,4].map(k=>`<path d="M${231+k*2.6} ${66-k*14}h${18-k*1.4}" stroke="${P("#a8743f","#7a5534",i)}" stroke-width="2.5"/>`).join("")}
  <!-- bucket + sponge -->
  <path d="M262 64h20l-3 16h-14z" fill="${P("#5eead4","#2dd4bf",i)}"/><rect x="266" y="58" width="12" height="6" rx="2" fill="#fcd34d"/>
  <!-- plant -->
  <path d="M86 80h12l-2-10h-8z" fill="${P("#c08a52","#7a5534",i)}"/><path d="M92 70c-8-8-4-16 0-18 4 2 8 10 0 18" fill="${P("#34d399","#10b981",i)}"/>`;

const maintC = (i, bad) => `
  <!-- C · Checklist & toolbox: a big clipboard of tasks (ticks, one red when overdue), an open toolbox, a gear turning -->
  <g transform="rotate(-6 150 40)">
    <rect x="122" y="4" width="62" height="74" rx="5" fill="${P("#c08a52","#7a5534",i)}"/>
    <rect x="128" y="12" width="50" height="62" rx="2" fill="#fff"/>
    <rect x="142" y="2" width="22" height="9" rx="3" fill="${P("#94a3b8","#64748b",i)}"/>
    ${[0,1,2,3].map(k=>{const red=bad&&k===1, todo=k===3;return `
      <rect x="133" y="${19+k*13}" width="8" height="8" rx="2" fill="none" stroke="${red?"#ef4444":P("#0d9488","#14b8a6",i)}" stroke-width="1.6"/>
      ${todo?"":red?`<path d="M135 ${21+k*13}l4 4M139 ${21+k*13}l-4 4" stroke="#ef4444" stroke-width="1.8"/>`:`<path d="M134.5 ${23+k*13}l2 2 4-4" fill="none" stroke="${P("#0d9488","#14b8a6",i)}" stroke-width="1.8"/>`}
      <rect x="145" y="${21+k*13}" width="${26-k*3}" height="3" rx="1.5" fill="${red?"#fca5a5":"#cbd5e1"}"/>`}).join("")}
  </g>
  <!-- toolbox -->
  <rect x="200" y="52" width="70" height="28" rx="4" fill="${P("#f97316","#c2410c",i)}"/>
  <path d="M200 52l8-12h54l8 12" fill="${P("#fb923c","#ea580c",i)}"/>
  <path d="M222 40v-6h26v6" fill="none" stroke="${P("#9a3412","#7c2d12",i)}" stroke-width="3"/>
  <rect x="230" y="60" width="10" height="5" rx="1" fill="${P("#fed7aa","#fdba74",i)}"/>
  <path d="M214 40l-6-14M250 40l10-18" stroke="${P("#94a3b8","#cbd5e1",i)}" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="20" r="4" fill="none" stroke="${P("#94a3b8","#cbd5e1",i)}" stroke-width="3"/>
  <!-- gear -->
  <g class="spin" style="transform-origin:96px 54px"><path d="M93 36h6l1.5 5 4.5 2 4.5-3 4 4-3 4.5 2 4.5 5 1.5v6l-5 1.5-2 4.5 3 4.5-4 4-4.5-3-4.5 2-1.5 5h-6l-1.5-5-4.5-2-4.5 3-4-4 3-4.5-2-4.5-5-1.5v-6l5-1.5 2-4.5-3-4.5 4-4 4.5 3 4.5-2z" fill="${P("#5eead4","#2dd4bf",i)}"/><circle cx="96" cy="54" r="6" fill="${P("#f0fdfa","#153838",i)}"/></g>`;

// ───────── Notify hub ─────────
const notifA = (i, bad) => `
  <!-- A · Post: a mailbox on its post, envelopes flying in along a dotted path; its flag up and a bell ringing on an alert -->
  <path d="M60 46 q60 -40 150 -6" fill="none" stroke="${P("#93c5fd","#5b7bb3",i)}" stroke-width="1.5" stroke-dasharray="3 5"/>
  ${[[78,30,-12],[128,16,-4],[172,22,6]].map(([x,y,r],k)=>`<g class="fly f${k}" transform="rotate(${r} ${x+11} ${y+7})"><rect x="${x}" y="${y}" width="22" height="15" rx="2" fill="#fff" stroke="${P("#93c5fd","#5b7bb3",i)}" stroke-width="1.8"/><path d="M${x} ${y+2}l11 7 11-7" fill="none" stroke="${P("#93c5fd","#5b7bb3",i)}" stroke-width="1.8"/></g>`).join("")}
  <!-- mailbox -->
  <rect x="232" y="44" width="6" height="36" fill="${P("#a8743f","#7a5534",i)}"/>
  <path d="M212 44v-12a14 14 0 0 1 14-14h20a14 14 0 0 1 14 14v12z" fill="${P("#3b82f6","#2f5fb8",i)}"/>
  <path d="M212 44v-12a14 14 0 0 1 28 0v12" fill="${P("#2563eb","#264f9c",i)}"/>
  <path d="M260 ${bad?"10":"30"}v-${bad?"0":"0"}" />
  <rect x="258" y="${bad?"6":"26"}" width="3" height="${bad?"24":"14"}" fill="${P("#64748b","#94a3b8",i)}"/>
  <rect x="261" y="${bad?"6":"26"}" width="12" height="8" fill="${bad?"#ef4444":P("#94a3b8","#64748b",i)}"/>
  ${bad?`<g class="ring" style="transform-origin:280px 46px"><path d="M272 66v-10a8 8 0 0 1 16 0v10z" fill="#fca5a5"/><rect x="270" y="65" width="20" height="3" rx="1.5" fill="#ef4444"/></g>
  <path class="wave" d="M293 50q4 5 0 10" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>`:""}
  <!-- grass tufts -->
  <path d="M40 80q4-8 8 0M48 80q3-6 6 0M100 80q4-7 8 0" stroke="${P("#60a5fa","#3b6aa8",i)}" stroke-width="2" fill="none"/>`;

const notifB = (i, bad) => `
  <!-- B · Mast: a relay tower broadcasting waves to the house's phones and a speaker; red waves and a blinking light on an alert -->
  <path d="M150 80l14-62 14 62M154 62h20M158 44h12M152 72l22-10M156 54l16-8" fill="none" stroke="${P("#64748b","#94a3b8",i)}" stroke-width="2.4"/>
  <circle cx="164" cy="14" r="4" fill="${bad?"#ef4444":P("#60a5fa","#93c5fd",i)}" class="${bad?"blink":""}"/>
  ${[1,2,3].map(k=>`<path class="wave w${k}" d="M${164-8-k*9} ${14-6-k*4}a${10+k*9} ${10+k*9} 0 0 0 0 ${12+k*8}M${164+8+k*9} ${14-6-k*4}a${10+k*9} ${10+k*9} 0 0 1 0 ${12+k*8}" fill="none" stroke="${bad?"#ef4444":P("#3b82f6","#60a5fa",i)}" stroke-width="2" stroke-linecap="round"/>`).join("")}
  <!-- phone left -->
  <g transform="rotate(-8 92 56)"><rect x="82" y="36" width="20" height="36" rx="4" fill="${P("#1e293b","#0f172a",i)}"/><rect x="85" y="41" width="14" height="24" rx="1.5" fill="${P("#bfdbfe","#3b5c8f",i)}"/><rect x="87" y="45" width="10" height="5" rx="1.5" fill="#fff"/></g>
  <!-- tablet / speaker right -->
  <rect x="214" y="46" width="22" height="34" rx="9" fill="${P("#334155","#1e293b",i)}"/><circle cx="225" cy="66" r="6" fill="${P("#64748b","#475569",i)}"/><circle cx="225" cy="53" r="2.5" fill="${P("#64748b","#475569",i)}"/>
  <g transform="rotate(10 266 58)"><rect x="256" y="40" width="20" height="36" rx="4" fill="${P("#1e293b","#0f172a",i)}"/><rect x="259" y="45" width="14" height="24" rx="1.5" fill="${bad?"#fecaca":P("#bfdbfe","#3b5c8f",i)}"/><rect x="261" y="49" width="10" height="5" rx="1.5" fill="${bad?"#ef4444":"#fff"}"/></g>
  <path d="M40 80q4-8 8 0M120 80q4-7 8 0M290 80q3-6 6 0" stroke="${P("#60a5fa","#3b6aa8",i)}" stroke-width="2" fill="none"/>`;

const notifC = (i, bad) => `
  <!-- C · Sorting desk: pigeonholes (one per category) filling with letters, a stack waiting for the digest, the bell on the desk -->
  <rect x="104" y="4" width="132" height="54" rx="4" fill="${P("#c08a52","#7a5534",i)}"/>
  ${[0,1,2,3].map(c=>[0,1].map(r=>`<rect x="${110+c*31}" y="${10+r*24}" width="27" height="20" rx="2" fill="${P("#fdf6e3","#2b2f3a",i)}"/>`).join("")).join("")}
  ${[[0,0],[1,0],[2,1],[3,0],[0,1]].map(([c,r],k)=>`<rect x="${113+c*31}" y="${16+r*24}" width="21" height="13" rx="1.5" fill="${bad&&k===2?"#fecaca":"#fff"}" stroke="${bad&&k===2?"#ef4444":P("#93c5fd","#5b7bb3",i)}" stroke-width="1.4"/>`).join("")}
  <!-- desk -->
  <rect x="84" y="58" width="200" height="7" rx="2" fill="${P("#a8743f","#5e4128",i)}"/>
  <rect x="94" y="65" width="6" height="15" fill="${P("#8a5f33","#4a331f",i)}"/><rect x="268" y="65" width="6" height="15" fill="${P("#8a5f33","#4a331f",i)}"/>
  <!-- stack for the digest -->
  ${[0,1,2].map(k=>`<rect x="${248+k}" y="${50-k*5}" width="26" height="8" rx="1.5" fill="#fff" stroke="${P("#93c5fd","#5b7bb3",i)}" stroke-width="1.4"/>`).join("")}
  <path d="M244 38h34" stroke="${P("#60a5fa","#93c5fd",i)}" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- desk bell -->
  <g class="${bad?"ring":""}" style="transform-origin:76px 48px"><path d="M62 58a14 14 0 0 1 28 0z" fill="${bad?"#fca5a5":P("#fcd34d","#eab308",i)}"/><rect x="58" y="57" width="36" height="3" rx="1.5" fill="${bad?"#ef4444":P("#b45309","#a16207",i)}"/><circle cx="76" cy="43" r="2.5" fill="${bad?"#ef4444":P("#b45309","#a16207",i)}"/></g>
  ${bad?`<path class="wave" d="M96 40q5 6 0 12M101 36q8 10 0 20" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>`:""}`;

const banner = (C, scene, dark, bad) => `
  <div class="card${dark ? " dark" : ""}">
    <div class="banner" style="background:${C.sky[dark ? 1 : 0]}">
      <svg class="scene" viewBox="0 0 300 80" preserveAspectRatio="xMaxYMax meet">${scene(dark ? 1 : 0, bad)}</svg>
      <div class="ground" style="background:${C.ground[dark ? 1 : 0]}"></div>
      <div class="head"><div class="ico" style="background:${bad ? (dark ? "#4a2323" : "#fde2e2") : C.ico[dark ? 1 : 0]};color:${bad ? "#db4437" : C.icoC}">${C === M ? "🔧" : "🔔"}</div>
        <div><div class="t">${C.title}<span class="pill" style="background:${bad ? (dark ? "#5a2626" : "#fde2e2") : dark ? "#21403a" : "#dcfce7"};color:${bad ? "#b91c1c" : dark ? "#86efac" : "#166534"}">${bad ? (C === M ? "2 overdue" : "Alert") : "All good"}</span></div><div class="s">${C.sub[bad ? 1 : 0]}</div></div></div>
    </div>
    <div class="body">… card content unchanged …</div>
  </div>`;

const sets = [
  ["Maintenance", M, [["A · Workshop — workbench, pegboard of tools, filter, wall calendar (red day when overdue)", maintA], ["B · Utility room — water heater with its gauge, washing machine, ladder, bucket", maintB], ["C · Checklist & toolbox — a clipboard of tasks (one crossed in red when overdue), open toolbox, turning gear", maintC]]],
  ["Notify Hub", N, [["A · Post — a mailbox on its post, letters flying in; flag up and a bell ringing on an alert", notifA], ["B · Mast — a relay tower broadcasting waves to phones and a speaker; red waves and a blinking light on an alert", notifB], ["C · Sorting desk — pigeonholes by category, a stack waiting for the digest, a desk bell that rings on an alert", notifC]]],
];
document.getElementById("out").innerHTML = sets.map(([name, C, opts]) => `<h2>${name}</h2>` + opts.map(([lab, fn]) => `
  <div class="lab">${lab}</div>
  <div class="row">${banner(C, fn, false, false)}${banner(C, fn, false, true)}</div>
  <div class="row" style="margin-top:10px">${banner(C, fn, true, false)}${banner(C, fn, true, true)}</div><div style="height:14px"></div>`).join("")).join("");
</script></body></html>
